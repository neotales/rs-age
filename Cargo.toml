[package]
name = "neotales-age"
description = "age v1 file encryption: recipients, identities, plugins, and encrypted containers"
version = "0.0.0-alpha.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/neotales/rs-age"
authors = ["x0craft"]
readme = "README.md"
keywords = ["age", "encryption", "file-encryption", "identity", "ssh"]
categories = ["cryptography", "command-line-interface"]

[dependencies]
aes = "0.9.2"
base64 = "0.22"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
chacha20poly1305 = { version = "0.11", features = ["reduced-round"] }
ctr = "0.10.1"
des = { version = "0.9.0", features = ["zeroize"] }
ed25519-dalek = { version = "3.0.0", features = ["alloc", "pkcs8"] }
getrandom = "0.3"
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["sys_rng"] }
hkdf = "0.13.0"
hmac = "0.13.0"
hpke = { version = "0.14.1", features = ["nistp"] }
md-5 = "0.11.0"
neotales-x509 = "0.0.0-alpha.2"
p256 = "0.14.0"
rsa = "0.10.0"
scrypt = "0.12.0"
sha2 = "0.11"
subtle = "2.6.1"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = { version = "=1.9.1", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[workspace]
members = ["."]
resolver = "3"
